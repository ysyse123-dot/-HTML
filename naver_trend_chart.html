const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const textColor = isDark ? '#cccccc' : '#555555';
const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';

const chart1 = new Chart(document.getElementById('chart1').getContext('2d'), {
  type: 'line',
  data: {
    labels,
    datasets: sites.map(s => ({
      label: s.name, data: s.data, borderColor: s.color,
      borderWidth: 2, pointRadius: 2, pointHoverRadius: 5,
      tension: 0.3, fill: false
    }))
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: isDark ? '#2a2a2a' : '#fff',
        borderColor: isDark ? '#444' : '#ddd', borderWidth: 1,
        titleColor: textColor, bodyColor: textColor,
        filter: item => !chart1.getDatasetMeta(item.datasetIndex).hidden,
        callbacks: { label: ctx => ` ${ctx.dataset.label}: ${Number(ctx.parsed.y).toFixed(2)}` }
      }
    },
    scales: {
      x: { ticks: { color: textColor, font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 14 }, grid: { color: gridColor } },
      y: { min: 0, max: 110, ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } }
    }
  }
});

const legend1 = document.getElementById('legend1');
sites.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'legend-btn';
  const sw = document.createElement('canvas');
  sw.width = 24; sw.height = 4; sw.style.cssText = 'flex-shrink:0;display:block;';
  const c = sw.getContext('2d');
  c.strokeStyle = s.color; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(0,2); c.lineTo(24,2); c.stroke();
  const txt = document.createElement('span');
  txt.textContent = s.name;
  btn.appendChild(sw); btn.appendChild(txt);
  btn.addEventListener('click', () => {
    const meta = chart1.getDatasetMeta(i);
    meta.hidden = !meta.hidden;
    btn.classList.toggle('off', meta.hidden);
    chart1.update();
  });
  legend1.appendChild(btn);
});
