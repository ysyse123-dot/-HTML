<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #1e293b;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
  }

  .header {
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
  }

  .chart-container {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    position: relative;
  }

  canvas { width: 100% !important; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 13px;
    font-weight: 500;
    user-select: none;
  }

  .legend-item:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .legend-item.disabled { opacity: 0.3; filter: grayscale(1); }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>

const ctx = document.getElementById('chart').getContext('2d');

const datasets = seriesData.map(s => ({
  label: s.label,
  data: s.data,
  borderColor: s.color,
  backgroundColor: s.color + '18',
  borderWidth: 2,
  pointRadius: 3,
  pointHoverRadius: 6,
  pointBackgroundColor: s.color,
  tension: 0.3,
  fill: false,
}));

const chart = new Chart(ctx, {
  type: 'line',
  data: { labels, datasets },
  options: {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#ffffff',
        borderColor: '#e2e8f0',
        borderWidth: 1,
        titleColor: '#0f172a',
        bodyColor: '#334155',
        titleFont: { family: 'Noto Sans KR', size: 12 },
        bodyFont: { family: 'DM Mono', size: 11 },
        padding: 12,
        callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}`
        }
      }
    },
    scales: {
      x: {
        grid: { color: '#f1f5f9' },
        ticks: {
          color: '#94a3b8',
          font: { family: 'DM Mono', size: 10 },
          maxRotation: 45,
          maxTicksLimit: 14
        }
      },
      y: {
        min: 0,
        max: 105,
        grid: { color: '#f1f5f9' },
        ticks: { color: '#94a3b8', font: { family: 'DM Mono', size: 11 } }
      }
    }
  }
});

const legend = document.getElementById('legend');
seriesData.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.style.borderColor = s.color + '88';
  item.style.background = s.color + '14';
  item.innerHTML = `<span class="legend-dot" style="background:${s.color}"></span>${s.label}`;
  item.addEventListener('click', () => {
    const meta = chart.getDatasetMeta(i);
    meta.hidden = !meta.hidden;
    item.classList.toggle('disabled');
    chart.update();
  });
  legend.appendChild(item);
});
</script>
</body>
</html>
