<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어휘 출제 서비스 검색 지표</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #1e293b;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
  }

  .header {
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
  }

  .chart-container {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    position: relative;
  }

  canvas {
    width: 100% !important;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 13px;
    font-weight: 500;
    user-select: none;
  }

  .legend-item:hover {
    transform: translateY(-1px);
    filter: brightness(1.1);
  }

  .legend-item.disabled {
    opacity: 0.3;
    filter: grayscale(1);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tooltip-custom {
    background: #1e2538 !important;
    border: 1px solid #2e3a50 !important;
    border-radius: 10px !important;
    padding: 10px 14px !important;
    font-family: 'Noto Sans KR', sans-serif !important;
    font-size: 12px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important;
  }
</style>
</head>
<body>

<div class="header">
  <h1>어휘 출제 서비스 — 검색 지표</h1>
  <p>2026.04.12 ~ 2026.05.11 &nbsp;·&nbsp; 네이버 데이터랩 트렌드 (정규화)</p>
</div>

<div class="chart-container">
  <canvas id="chart" height="420"></canvas>
  <div class="legend" id="legend"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const labels = ["04/12","04/13","04/14","04/15","04/16","04/17","04/18","04/19","04/20","04/21","04/22","04/23","04/24","04/25","04/26","04/27","04/28","04/29","04/30","05/01","05/02","05/03","05/04","05/05","05/06","05/07","05/08","05/09","05/10","05/11"];

const seriesData = [
  { label: 'NE Tutor',   data: [0.696,3.363,3.193,2.836,2.870,2.446,1.002,0.543,3.227,2.887,2.870,2.836,2.106,0.815,1.019,3.651,3.040,2.887,3.312,0.662,0.526,1.053,2.615,0.679,4.671,4.518,3.906,1.563,0.781,4.772], color: '#38bdf8' },
  { label: '동아출판',    data: [16.033,20.380,18.750,20.380,17.510,15.353,13.502,14.572,17.680,19.599,18.988,16.474,15.149,12.704,14.181,16.780,13.927,11.430,7.541,4.755,4.161,4.552,6.114,5.197,11.600,11.260,8.967,5.639,6.267,12.024], color: '#a78bfa' },
  { label: '이투스북',    data: [50.696,56.861,55.163,54.280,47.385,45.329,41.899,43.224,49.507,49.898,50.306,49.287,45.109,38.995,37.755,48.217,50.119,49.881,50.832,44.158,40.693,43.886,53.736,48.556,64.759,100.0,55.876,43.665,45.194,55.995], color: '#34d399' },
  { label: '쎄듀북',     data: [3.244,6.539,5.944,5.588,5.808,4.738,3.108,2.904,5.927,5.316,5.673,5.282,4.789,3.057,3.295,5.757,6.250,6.675,6.980,4.484,4.212,3.397,9.120,4.195,13.111,12.772,10.581,6.437,6.471,13.808], color: '#fb923c' },
  { label: '해커스북',    data: [49.966,73.675,66.644,66.916,58.492,53.923,41.763,45.720,71.501,65.319,60.904,60.598,51.953,64.504,56.386,67.697,60.819,58.186,51.189,38.077,31.709,39.453,54.484,47.877,63.740,58.016,52.717,41.321,47.452,68.580], color: '#f472b6' },
  { label: 'YBM북샘',    data: [24.592,31.182,23.879,24.966,23.047,21.739,16.542,15.302,28.601,49.236,24.592,26.851,23.964,21.145,22.537,27.751,24.321,27.106,24.847,15.914,12.432,17.527,24.864,44.056,31.471,26.274,24.100,19.837,21.824,35.360], color: '#facc15' },
  { label: '클래스카드',  data: [26.630,62.755,64.521,63.349,63.706,48.047,17.646,23.183,57.575,59.800,56.624,52.310,42.001,17.171,18.971,47.079,42.221,42.561,39.691,10.360,9.205,11.447,25.543,15.065,63.077,61.532,51.495,14.793,19.124,72.249], color: '#60a5fa' },
  { label: '100발100중', data: [3.974,5.927,5.350,4.959,4.908,6.182,12.602,10.887,5.876,3.736,4.161,3.991,3.821,2.819,2.700,3.516,2.395,1.630,0.985,0.442,0.323,0.391,1.172,0.459,1.172,1.342,1.240,0.798,0.747,1.563], color: '#f87171' },
];

const ctx = document.getElementById('chart').getContext('2d');

const datasets = seriesData.map(s => ({
  label: s.label,
  data: s.data,
  borderColor: s.color,
  backgroundColor: s.color + '18',
  borderWidth: 2,
  pointRadius: 3,
  pointHoverRadius: 6,
  pointBackgroundColor: s.color,
  tension: 0.3,
  fill: false,
}));

const chart = new Chart(ctx, {
  type: 'line',
  data: { labels, datasets },
  options: {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#ffffff',
        borderColor: '#e2e8f0',
        borderWidth: 1,
        titleColor: '#0f172a',
        bodyColor: '#334155',
        titleFont: { family: 'Noto Sans KR', size: 12 },
        bodyFont: { family: 'DM Mono', size: 11 },
        padding: 12,
        callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}`
        }
      }
    },
    scales: {
      x: {
        grid: { color: '#f1f5f9' },
        ticks: { color: '#94a3b8', font: { family: 'DM Mono', size: 11 }, maxRotation: 0 }
      },
      y: {
        min: 0,
        max: 105,
        grid: { color: '#f1f5f9' },
        ticks: { color: '#94a3b8', font: { family: 'DM Mono', size: 11 } }
      }
    }
  }
});

// Custom legend
const legend = document.getElementById('legend');
seriesData.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.style.borderColor = s.color + '88';
  item.style.background = s.color + '14';
  item.innerHTML = `<span class="legend-dot" style="background:${s.color}"></span>${s.label}`;
  item.addEventListener('click', () => {
    const meta = chart.getDatasetMeta(i);
    meta.hidden = !meta.hidden;
    item.classList.toggle('disabled');
    chart.update();
  });
  legend.appendChild(item);
});
</script>
</body>
</html>
