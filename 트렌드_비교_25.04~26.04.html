  .legend-dot {

    border-radius: 50%;
    flex-shrink: 0;

  .chart-wrapper {

    width: 100%;

const activeStates = {};
SERVICES.forEach(s => activeStates[s] = true);

// Build legend
const legendEl = document.getElementById('legend');
SERVICES.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.style.borderColor = COLORS[i];
  item.style.color = COLORS[i];
  item.style.background = COLORS[i] + '18';
  item.innerHTML = `<span class="legend-dot" style="background:${COLORS[i]}"></span>${s}`;
  item.addEventListener('click', () => {
    const isActive = activeStates[s];
    activeStates[s] = !isActive;
    const ds = chart.data.datasets.find(d => d.label === s);
    if (ds) ds.hidden = isActive;
    item.classList.toggle('disabled', isActive);
    chart.update();
  });
  legendEl.appendChild(item);
});

// Build datasets

  label: s,
  data: VALUES[s],
  borderColor: COLORS[i],
  backgroundColor: COLORS[i] + '12',
  borderWidth: 2,
  pointRadius: 2.5,
  pointHoverRadius: 6,
  pointBackgroundColor: '#fff',
  pointBorderColor: COLORS[i],
  pointBorderWidth: 2,
  tension: 0.35,
  fill: false,
}));

const chart = new Chart(ctx, {
  type: 'line',
  data: { labels: DATES, datasets },
  options: {

    maintainAspectRatio: true,
